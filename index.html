<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Volunteer-NY Toronto is the premier volunteering platform for high schools across Toronto, Ontario, and North York. Explore opportunities, log hours, and build community." />
    <title>Volunteer-NY Toronto</title>
    
    <!-- SEO & Metadata compliance.
         canonical and og:url must name the origin that actually serves the app;
         a canonical pointing elsewhere tells search engines not to index this
         one. Update both together if the custom domain goes live. -->
    <link rel="canonical" href="https://www.volunteernorthyork.org/" />

    <!-- Open Graph tags -->
    <meta property="og:title" content="Volunteer-NY Toronto - High School Volunteering" />
    <meta property="og:description" content="The premier volunteering platform for high school students in North York and across Toronto." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.volunteernorthyork.org/" />
    <meta property="og:site_name" content="Volunteer North York" />
    <!-- twitter:card below promises a large image, so one has to be declared. -->
    <meta property="og:image" content="https://volunteernorthyork.org/hero-bg.png" />
    <meta property="og:image:alt" content="Volunteer North York" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Volunteer-NY Toronto - High School Volunteering" />
    <meta name="twitter:description" content="Explore opportunities, log hours, and build community with Volunteer-NY Toronto." />
    <meta name="twitter:image" content="https://volunteernorthyork.org/hero-bg.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Discovered during the initial HTML parse, so it runs in parallel with
         the app stylesheet rather than being found only after it parses.
         Moved here from an @import at the top of src/index.css. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&amp;display=swap" />

    <!--
      The hero background is applied via a Tailwind bg-[url(...)] class, so the
      browser cannot discover it until the CSS that references it has been
      parsed — it was starting at 1.49s at Low priority and became the LCP
      element at 1.93s. Preloading it from the document promotes it to a
      high-priority fetch that starts immediately.
    -->
    <script>
      // Only "/" paints hero-bg.png, and it is that route's LCP element, so the
      // preload is worth keeping there — the image is referenced from a CSS
      // class inside a JS chunk, so without it the fetch cannot start until the
      // bundle parses.
      //
      // It must NOT be unconditional though: as a plain <link> in this shared
      // index.html it fired on every entry point, costing anyone who deep-linked
      // to /login, /signup or a dashboard a 292KB download they never used, and
      // logging "preloaded but not used" on each of those routes.
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/hero-bg.png';
        heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      }
    </script>
    <!--
      leaflet.css used to load render-blocking from unpkg.com on EVERY page,
      though maps appear on two of them, and it made a third-party CDN a single
      point of failure for the whole site. It is now imported from the npm
      package inside AddressMapsSelector, so it ships in that route's chunk.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!--
      A visually hidden <h2> used to sit here, ahead of #root, so an H2 preceded
      the real H1 on every page — the opposite of what it was meant to do for
      SEO and for a screen reader's heading list. The document title and the
      per-page H1 rendered by React cover this properly.
    -->
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; text-align: center;">
        Volunteer North York needs JavaScript enabled to run. Please turn it on and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
