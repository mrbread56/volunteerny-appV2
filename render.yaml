services:
  - type: web
    name: volunteerny-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Every value below must be set in the dashboard (sync: false keeps secrets
    # out of the repo). They are listed here so a deploy fails loudly at
    # configuration time rather than at runtime.
    #
    # MAIL_FROM in particular is not optional: server.ts calls process.exit(1)
    # when it is unset and NODE_ENV=production, because organizations are
    # created with twoFactorEnabled: true and cannot log in without an emailed
    # code. The VITE_* values are inlined at BUILD time, so adding one later
    # requires a rebuild, not just a restart.
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: FIREBASE_DATABASE_ID
        sync: false
      - key: VITE_DEVELOPER_EMAILS
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_ID
        sync: false
