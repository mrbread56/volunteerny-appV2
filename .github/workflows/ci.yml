# Continuous integration.
#
# Until this existed, all nine check scripts depended on somebody remembering to
# run them — which is how an extensionless import once took the entire API down
# in production while every local gate stayed green.
#
# Two tiers on purpose:
#
#   verify  — types, ESM resolution, production build, email template links.
#             Needs no credentials, so it runs on every push and every pull
#             request including forks.
#
#   live    — the checks that talk to the real Firebase project. They create
#             throwaway accounts and delete them afterwards, so they need
#             secrets and must never run on a forked pull request. When the
#             secrets are absent the job warns and skips rather than failing,
#             so a contributor without access still gets useful feedback.
#
# Note: GitHub Actions does not support YAML anchors, so the env block below is
# repeated per step. Do not try to factor it out with &anchor / *alias — the
# workflow silently fails to parse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, ESM guard, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `lint` is tsc plus check:esm. The ESM guard is not optional: the app's
      # tsconfig uses moduleResolution "bundler", which permits extensionless
      # relative imports that throw ERR_MODULE_NOT_FOUND at load time on Vercel
      # and take down every /api route at once.
      - name: Typecheck and ESM resolution
        run: npm run lint

      - name: Production build
        run: npm run build

      # A delivered email whose buttons are dead is not a working email, and
      # that is invisible from the inbox. Needs no credentials.
      - name: Email template links
        run: npx tsx scripts/check-email.ts --links-only

      # The printed hours transcript is evidence a student hands to a school.
      # Needs no credentials, so it runs in the always-on tier.
      - name: Printable transcript
        run: npx tsx scripts/check-certificate.ts

  live:
    name: Security and flows (real project)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
      VITE_DEVELOPER_EMAILS: ${{ secrets.VITE_DEVELOPER_EMAILS }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Are credentials configured?
        id: creds
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase secrets are not set, so the live checks were skipped. Add them under Settings > Secrets and variables > Actions."
          fi

      # check:security boots the production bundle, so the build must exist.
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: npm run build

      # Adversarial: cross-tenant reads, privilege escalation, API
      # authorization, and the self-approval attack on graduation hours. A
      # regression here is a security incident, not a failed test.
      - name: Security (51 adversarial checks)
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/check-security.ts

      # The whole student-organization journey against real data.
      - name: Application and hours flows
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/check-flows.ts

      - name: Signup and self-crediting refusal
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/check-signup.ts

      # A missing index otherwise only surfaces the first time real data exists.
      - name: Query indexes
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/check-queries.ts

      - name: Hour arithmetic
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/check-hours.ts
